# Configuración del análisis de SonarCloud (QG-7 del SQA Plan).
sonar.organization=hlee-umg
sonar.projectKey=hlee-umg_SmileeSync
sonar.projectName=SmileeSync

sonar.sources=app,infra
sonar.tests=app/tests
sonar.exclusions=**/migrations/**,app/staticfiles/**,app/htmlcov/**
sonar.test.inclusions=app/tests/**

# Cobertura generada por pytest-cov en la etapa test del pipeline.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=app/coverage.xml
sonar.coverage.exclusions=app/tests/**,infra/**,app/manage.py,app/config/asgi.py,app/config/wsgi.py

sonar.sourceEncoding=UTF-8
