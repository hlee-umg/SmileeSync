{% comment %}Buscador y filtro de inactivos, compartido por las tres pestañas.{% endcomment %}
<form method="get" class="d-flex flex-wrap gap-2 mb-3">
  <div class="input-group input-group-sm" style="max-width:340px;">
    <span class="input-group-text"><i class="bi bi-search"></i></span>
    <input class="form-control" name="q" value="{{ q }}" placeholder="Buscar...">
    <button class="btn btn-outline-primary">Buscar</button>
  </div>
  <div class="form-check form-switch align-self-center ms-2">
    <input class="form-check-input" type="checkbox" name="inactivos" value="1"
           id="sw-inactivos" {% if mostrar_inactivos %}checked{% endif %}
           onchange="this.form.submit()">
    <label class="form-check-label small" for="sw-inactivos">Mostrar inactivos</label>
  </div>
</form>
